name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION=$(node -e "const fs=require('fs'); const text=fs.readFileSync('app.config.ts','utf8'); const match=text.match(/version:\s*[\\\"']([^\\\"']+)[\\\"']/); if (!match) process.exit(1); process.stdout.write(match[1]);")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building app version $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-calendar-apk-v${{ steps.app-version.outputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish numbered APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app-version.outputs.tag }}
          name: Android APK v${{ steps.app-version.outputs.version }}
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            APK مستقل للإصدار v${{ steps.app-version.outputs.version }} مبني تلقائيًا من الفرع main.
            Commit: ${{ github.sha }}
